{% extends 'base.html' %}
{% block title %}Sortie Hospitalisation - Saint Joseph{% endblock %}
{% block content %}
<div class="md:ml-64 p-8 mt-16 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-lg shadow-xl p-8 text-center">
            <i class="fas fa-sign-out-alt text-green-600 text-5xl mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Sortie Hospitalière</h2>
            <p class="text-gray-600 mb-6">Confirmer la sortie du patient de l'hôpital?</p>
            <div class="bg-green-50 border border-green-200 rounded p-4 mb-6 text-sm text-green-800">
                <i class="fas fa-info-circle mr-2"></i>
                Le statut passera à "Sortie" et la date actuelle sera enregistrée.
            </div>
            <div class="space-y-3">
                <form method="post" class="w-full">
                    {% csrf_token %}
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
                        <i class="fas fa-check mr-2"></i>Confirmer la Sortie
                    </button>
                </form>
                <a href="javascript:history.back()" class="block bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 rounded-lg text-center transition">
                    <i class="fas fa-times mr-2"></i>Annuler
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
