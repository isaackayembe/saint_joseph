{% extends 'base.html' %}

{% block title %}Déconnexion - Saint Joseph{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center">
    <div class="w-full max-w-md text-center">
        <!-- Logo -->
        <div class="mb-8">
            <i class="fas fa-hospital text-white text-6xl mb-4"></i>
            <h1 class="text-3xl font-bold text-white">Saint Joseph</h1>
        </div>

        <!-- Message -->
        <div class="bg-white rounded-lg shadow-xl p-8">
            <i class="fas fa-check-circle text-green-500 text-5xl mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Déconnecté</h2>
            <p class="text-gray-600 mb-6">
                Vous avez été déconnecté avec succès.
            </p>
            
            <!-- Login Button -->
            <a href="{% url 'saint_joseph:login' %}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition">
                <i class="fas fa-sign-in-alt mr-2"></i>Se reconnecter
            </a>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-white text-center text-sm">
            <p>Merci d'avoir utilisé Saint Joseph</p>
        </div>
    </div>
</div>
{% endblock %}
