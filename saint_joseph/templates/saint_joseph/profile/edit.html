{% extends 'base.html' %}
{% block title %}Modifier Profil - Saint Joseph{% endblock %}
{% block content %}
<div class="md:ml-64 p-8 mt-16">
    <div class="max-w-2xl">
        <h2 class="text-3xl font-bold text-gray-800 mb-8">Modifier Mon Profil</h2>
        <div class="bg-white rounded-lg shadow p-8">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <div class="border-b pb-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Informations</h3>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Rôle</label>
                            {{ form.role }}
                        </div>
                    </div>
                </div>

                <div class="border-b pb-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Contact</h3>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Téléphone</label>
                        {{ form.telephone }}
                    </div>

                    <div class="mt-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Adresse</label>
                        {{ form.adresse }}
                    </div>
                </div>

                <div class="flex gap-4 pt-6 border-t">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                        <i class="fas fa-save mr-2"></i>Mettre à Jour
                    </button>
                    <a href="{% url 'saint_joseph:user_profile' %}" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 rounded-lg text-center transition">
                        <i class="fas fa-times mr-2"></i>Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
