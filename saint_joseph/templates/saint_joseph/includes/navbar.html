<!-- Navbar -->
<nav class="bg-white shadow-md sticky top-0 z-40">
    <div class="px-6 py-4 flex justify-between items-center">
        <!-- Logo -->
        <div class="flex items-center">
            <i class="fas fa-hospital mr-2 text-blue-600 text-2xl"></i>
            <h1 class="text-2xl font-bold text-gray-800">Saint Joseph</h1>
        </div>

        <!-- User Menu -->
        <div class="flex items-center space-x-4">
            {% if user.is_authenticated %}
            <span class="text-gray-700">
                <i class="fas fa-user-circle mr-2"></i>{{ user.get_full_name }}
            </span>
            <div class="relative group">
                <button class="text-gray-600 hover:text-gray-900">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div
                    class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-all">
                    <a href="{% url 'saint_joseph:user_profile' %}"
                        class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                        <i class="fas fa-user mr-2"></i>Mon Profil
                    </a>
                    <a href="{% url 'saint_joseph:user_profile_edit' %}"
                        class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                        <i class="fas fa-edit mr-2"></i>Modifier Profil
                    </a>
                    <hr class="my-2">
                    <a href="{% url 'saint_joseph:logout' %}"
                        class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                        <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
                    </a>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</nav>
