{% extends 'base.html' %}
{% block title %}Ajouter Diagnostic - Saint Joseph{% endblock %}
{% block content %}
<div class="md:ml-64 p-8 mt-16">
    <div class="max-w-2xl">
        <h2 class="text-3xl font-bold text-gray-800 mb-8">Ajouter un Diagnostic</h2>
        <div class="bg-white rounded-lg shadow p-8">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Consultation *</label>
                    {{ form.consultation }}
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Libellé *</label>
                    {{ form.libelle }}
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Description *</label>
                    {{ form.description }}
                </div>
                <div class="flex gap-4 pt-6 border-t">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                        <i class="fas fa-save mr-2"></i>Enregistrer
                    </button>
                    <a href="javascript:history.back()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 rounded-lg text-center transition">
                        <i class="fas fa-times mr-2"></i>Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
